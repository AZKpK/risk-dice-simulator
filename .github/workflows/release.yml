name: Release APK

# Every pushed tag: run the unit tests, build the APK and attach it to a GitHub release.
on:
  push:
    tags: ['**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional. Without these secrets a debug-signed APK is published instead.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          versioning=(-PversionName="$version" -PversionCode="$GITHUB_RUN_NUMBER")
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
            ./gradlew :app:assembleRelease "${versioning[@]}"
            apk=app/build/outputs/apk/release/app-release.apk
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; publishing a debug-signed APK."
            ./gradlew :app:assembleDebug "${versioning[@]}"
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p dist
          cp "$apk" "dist/risk-dice-simulator-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
